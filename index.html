<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Battlefront Conquest Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: holotable — galaxy chart fills the left, a command console docks right (stacks on phones). Single deliberate dark look. */
:root{
  color-scheme: dark;
  --bg:#0a1018; --panel:#101a26; --panel2:#152232; --line:#24364b; --line2:#2f4660;
  --fg:#dbe5ef; --muted:#8597ab; --faint:#5b6d82;
  --accent:#f0b44c;          /* holotable amber: selection + calls to action */
  --you:#4ea8e8; --foe:#e2604f; --neutral:#6f7c8c;
  --win:#5cc28a; --loss:#e2604f;
  --display:"Chakra Petch", "Segoe UI", system-ui, sans-serif;
  --body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Consolas, monospace;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:14px;line-height:1.5;padding-inline:16px;padding-block:12px 24px}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:1320px;margin:0 auto;display:flex;flex-direction:column;gap:12px}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 20px;padding-block:6px}
.brand{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:.06em;text-transform:uppercase;line-height:1.1}
.brand small{display:block;font-family:var(--mono);font-weight:400;font-size:11px;letter-spacing:.08em;color:var(--muted);text-transform:none}
.stats{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--muted)}
.stats b{color:var(--fg);font-weight:500;font-variant-numeric:tabular-nums}
.balance{display:flex;height:8px;width:180px;border-radius:2px;overflow:hidden;background:var(--line)}
.balance i{display:block;height:100%}

/* main */
.main{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:12px;align-items:start}
@media (max-width:900px){.main{grid-template-columns:minmax(0,1fr)}}
.chart{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:hidden;min-width:0}
.chart-scroll{overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.chart.zoomed .chart-scroll{max-height:min(62vh,640px)}
.chart svg{display:block;width:100%;height:auto;max-width:none}
.zoombar{position:absolute;right:10px;top:8px;display:flex;gap:4px;z-index:2}
.zoombar button{background:color-mix(in srgb,var(--bg) 85%,transparent);border:1px solid var(--line2);border-radius:4px;min-width:36px;height:36px;padding:0 8px;font-weight:600;cursor:pointer}
.chart .tag{z-index:2;max-width:calc(100% - 170px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;position:absolute;left:12px;top:10px;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);background:color-mix(in srgb,var(--bg) 80%,transparent);padding:3px 8px;border:1px solid var(--line2);border-radius:3px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;padding:8px 12px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}

.planet{cursor:pointer}
.planet text{font-family:var(--display);font-size:13px;font-weight:600;letter-spacing:.03em;fill:var(--fg);paint-order:stroke;stroke:var(--panel);stroke-width:4px}
.planet .sub{font-family:var(--mono);font-size:10px;font-weight:400;fill:var(--muted)}
.target-ring{fill:none;stroke:var(--accent);stroke-width:1.5;stroke-dasharray:4 3}
.sel-ring{fill:none;stroke:var(--accent);stroke-width:2.5}
.fight-ring{fill:none;stroke:var(--accent);stroke-width:2;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.fight-ring{animation:none}}

/* timeline */
.timeline{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.label{font-family:var(--display);font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{width:26px;height:26px;border-radius:3px;display:grid;place-items:center;font-family:var(--mono);font-size:11px;font-weight:500;color:var(--bg);cursor:default}
.chip.w{background:var(--win)} .chip.l{background:var(--loss)}
.chip.def{box-shadow:inset 0 0 0 2px var(--bg)}
.empty{color:var(--faint);font-size:13px}
.chip{cursor:pointer;border:0;padding:0}
.chip.on{outline:2px solid var(--accent);outline-offset:1px}
.chipinfo{font-size:12.5px;color:var(--muted);min-height:1.2em}
button,a,.planet{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.actionbar{display:none}
.actionbar .bar-title{font-family:var(--display);font-weight:700;font-size:16px;line-height:1.2}
.actionbar .bar-sub{font-size:12.5px;color:var(--muted)}

/* console */
.console{background:var(--panel);border:1px solid var(--line);border-radius:6px;display:flex;flex-direction:column;min-width:0}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:10px 4px;font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.pane{padding:14px;display:flex;flex-direction:column;gap:14px;min-width:0}

.card{background:var(--panel2);border:1px solid var(--line2);border-radius:5px;padding:14px;display:flex;flex-direction:column;gap:10px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--accent);text-transform:uppercase}
.h1{font-family:var(--display);font-weight:700;font-size:24px;line-height:1.15;text-wrap:balance}
.h2{font-family:var(--display);font-weight:600;font-size:16px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:500}
.note{font-size:12.5px;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1px solid var(--line2);background:var(--panel);border-radius:4px;padding:8px 14px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#1b1408;font-weight:600}
.btn.win{background:var(--win);border-color:var(--win);color:#08170f;font-weight:600;flex:1}
.btn.loss{background:var(--loss);border-color:var(--loss);color:#1d0a07;font-weight:600;flex:1}
.btn.small{padding:5px 10px;font-size:12.5px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.side-pill{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;font-weight:600;color:var(--bg)}

/* setup form */
.field{display:flex;flex-direction:column;gap:5px}
.field > label,.field > .flabel{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.04em}
select,input[type=number],textarea{background:var(--bg);border:1px solid var(--line2);border-radius:4px;padding:7px 9px;width:100%}
textarea{font-family:var(--mono);font-size:11.5px;min-height:90px;resize:vertical}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.seg button{background:var(--bg);border:1px solid var(--line2);border-radius:4px;padding:6px 10px;cursor:pointer;font-size:13px}
.seg button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.checks{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:13px}
.checks label{display:inline-flex;gap:6px;align-items:center;cursor:pointer}
input[type=checkbox],input[type=range]{accent-color:var(--accent)}
details{border:1px solid var(--line);border-radius:4px;padding:8px 10px}
summary{cursor:pointer;font-weight:600;font-size:13px}
.pool{display:flex;flex-direction:column;gap:10px;margin-top:10px;max-height:340px;overflow:auto}
.pool h4{margin:0;font-family:var(--display);font-size:13px;letter-spacing:.04em}
.pool label{display:flex;gap:8px;align-items:baseline;font-size:12.5px;padding-left:4px;cursor:pointer}
.pool small{color:var(--faint);font-family:var(--mono);font-size:10.5px}
.log{display:flex;flex-direction:column;gap:6px;max-height:520px;overflow:auto}
.log div{font-size:12.5px;border-left:2px solid var(--line2);padding-left:8px}
.log .t{font-family:var(--mono);color:var(--faint);font-size:11px;margin-right:6px}
.maplist{margin:0;padding-left:18px;font-size:12.5px;display:flex;flex-direction:column;gap:3px}
.maplist small{color:var(--muted)}
.banner{border:1px solid var(--accent);border-radius:5px;padding:12px;display:flex;flex-direction:column;gap:6px}
@media (max-width:900px){
  .actionbar:not([hidden]){display:flex;flex-direction:column;gap:8px;position:fixed;left:0;right:0;bottom:0;z-index:10;
    padding:10px 16px calc(10px + env(safe-area-inset-bottom, 0px));background:var(--panel2);border-top:1px solid var(--line2);box-shadow:0 -10px 28px rgba(0,0,0,.45)}
  body.has-bar{padding-bottom:170px}
  .btn{min-height:44px}
  .btn.small{min-height:40px}
  .seg button{min-height:40px}
  .tabs button{padding:13px 4px}
  select,input[type=number],textarea{font-size:16px}
  .checks label{min-height:32px}
  .pool label{min-height:30px;align-items:center}
  .h1{font-size:21px}
  .brand{font-size:17px}
  .stats{margin-left:0;width:100%;justify-content:space-between}
  .balance{width:120px}
  .chip{width:30px;height:30px}
}
</style>
</head><body>
<div class="app">
  <header class="top">
    <div class="brand">Battlefront Conquest Planner<small>Star Wars Battlefront II (2005) · your installed maps</small></div>

        <button role="tab" data-tab="save">Save</button>

      <div class="pane" id="pane"></div>
    </aside>
  </div>
</div>
<div class="actionbar" id="actionbar" hidden></div>

/* ---------- persistence ---------- */
function save(){ try{ localStorage.setItem(KEY, JSON.stringify({setup:S.setup, game:S.game, undo:S.undo.slice(-15)})); }catch(e){} }
function load(){

/* ---------- map pool ---------- */
const mapByKey = Object.fromEntries(MAPS.map(m=>[m.key,m]));
function allowedModes(m, era, cfg){ return (m.eras[era]||[]).filter(x=>cfg.modes.includes(x)); }
function candidates(pid, space, cfg, era){
  return MAPS.filter(m=>m.planet===pid && m.space===space && (m.src==="stock"?cfg.stock:cfg.mods)
    && !cfg.excluded.includes(m.key) && allowedModes(m, era, cfg).length);
}
function eligible(cfg, era){
  return Object.keys(PLANETS).filter(p=>candidates(p,false,cfg,era).length || candidates(p,true,cfg,era).length);
}
const dist = (a,b)=>Math.hypot(PLANETS[a].x-PLANETS[b].x, PLANETS[a].y-PLANETS[b].y);
function lanesFor(ids){
  const set = new Set(), add=(a,b)=>set.add([a,b].sort().join("|"));
  for(const a of ids){ ids.filter(b=>b!==a).sort((x,y)=>dist(a,x)-dist(a,y)).slice(0,2).forEach(b=>add(a,b)); }
  if(ids.length){ const inT=new Set([ids[0]]);            // spanning tree guarantees every planet is reachable
    while(inT.size<ids.length){ let best=null;
      for(const a of inT) for(const b of ids) if(!inT.has(b) && (!best||dist(a,b)<best[2])) best=[a,b,dist(a,b)];
      add(best[0],best[1]); inT.add(best[1]); } }
  return [...set].map(s=>s.split("|"));
}
const neighbors = (pid, lanes)=>lanes.filter(l=>l.includes(pid)).map(l=>l[0]===pid?l[1]:l[0]);
function bfs(start, ids, lanes){
  const d={[start]:0}, q=[start];
  while(q.length){ const a=q.shift(); for(const b of neighbors(a,lanes)) if(!(b in d)){ d[b]=d[a]+1; q.push(b);} }
  return d;
}
function capitalsFor(cfg, ids){
  const pref = ERAS[cfg.era].caps.slice(); if(cfg.side===1) pref.reverse(); // [player capital, enemy capital]
  let you = ids.includes(pref[0]) ? pref[0] : null, foe = ids.includes(pref[1]) ? pref[1] : null;
  if(!you) you = ids.slice().sort((a,b)=>dist(a,pref[0])-dist(b,pref[0]))[0];
  if(!foe || foe===you) foe = ids.filter(p=>p!==you).sort((a,b)=>dist(b,you)-dist(a,you))[0];
  return [you, foe];
}
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function startingOwners(cfg, ids, lanes, caps, keepCustom){
  const owner={}, d0=bfs(caps[0],ids,lanes), d1=bfs(caps[1],ids,lanes);
  const rest=shuffle(ids.filter(p=>!caps.includes(p)));
  const total=ids.length, nYou=Math.max(1,Math.min(cfg.youN??4,total-1)), nFoe=Math.max(1,Math.min(cfg.foeN??12,total-nYou));
  let pool=rest.slice();
  // front lines: each side grows outward from its capital; scattered: random picks
  const take=(n,key)=>{ const order = cfg.start==="random" ? pool : pool.slice().sort((a,b)=>(key[a]??99)-(key[b]??99));
    const got=order.slice(0,Math.max(0,n)); pool=pool.filter(p=>!got.includes(p)); return got; };
  // the side with fewer planets picks first so its pocket stays around its capital
  const youFirst = nYou<=nFoe;
  const a1 = youFirst ? take(nYou-1,d0) : take(nFoe-1,d1);
  const a2 = youFirst ? take(nFoe-1,d1) : take(nYou-1,d0);
  const mine = youFirst?a1:a2, theirs = youFirst?a2:a1;
  for(const p of ids) owner[p]=-1;
  mine.forEach(p=>owner[p]=0); theirs.forEach(p=>owner[p]=1);
  if(cfg.start==="custom" && keepCustom) for(const p of ids) if(p in cfg.custom) owner[p]=cfg.custom[p];
  owner[caps[0]]=0; owner[caps[1]]=1;
  return owner;
}

/* preview for the setup screen (stable between renders) */
let previewCache = null;
function preview(force){
  const cfg=S.setup, sig=JSON.stringify([cfg.era,cfg.side,cfg.start,cfg.youN,cfg.foeN,cfg.stock,cfg.mods,cfg.modes,cfg.excluded]);
  if(previewCache && previewCache.sig===sig && !force){
    if(cfg.start==="custom") for(const p in cfg.custom) if(p in previewCache.owner && !previewCache.caps.includes(p)) previewCache.owner[p]=cfg.custom[p];
    return previewCache;
  }
  const ids=eligible(cfg,cfg.era), lanes=lanesFor(ids), caps=capitalsFor(cfg,ids);
  const owner=startingOwners(cfg,ids,lanes,caps,true);
  previewCache={sig,ids,lanes,caps,owner};
  return previewCache;
}

/* ---------- fleets ---------- */
const fleetsOn = ()=> S.game && (S.game.cfg.fleets||0)>0;
const fleets = ()=> (S.game && S.game.fleets) || [];
const fleetById = (id)=> fleets().find(f=>f.id===id);
const alive = (side)=> fleets().filter(f=>f.side===side && !f.down);
const fleetsAt = (pid, side)=> alive(side).filter(f=>f.at===pid);
const fleetLabel = (f)=> `${f.side===0?"Your":"Enemy"} ${f.name}`;
function initFleets(g){
  g.fleets=[];
  for(const side of [0,1]){
    const cap=g.caps[side], foeCap=g.caps[1-side];
    const front=g.planets.filter(p=>g.owner[p]===side && p!==cap).sort((a,b)=>dist(a,foeCap)-dist(b,foeCap))[0] || cap;
    for(let i=0;i<(g.cfg.fleets||0);i++) g.fleets.push({id:`${side}-${i}`, side, name:`${ORD[i]} Fleet`, at:i===0?cap:front, down:0});
  }
}
function destroyFleet(f){
  const g=S.game; f.down=g.turn+RESPAWN; f.at=null;
  logMsg(`${fleetLabel(f)} was destroyed. It will be rebuilt on turn ${f.down} at a random planet its side holds.`);
  if(S.fleetSel===f.id) S.fleetSel=null;
}
function retreatFleet(f){
  const g=S.game, opts=neighbors(f.at,g.lanes).filter(n=>g.owner[n]===f.side);
  if(opts.length){ const to=opts[Math.floor(Math.random()*opts.length)]; logMsg(`${fleetLabel(f)} retreats from ${pname(f.at)} to ${pname(to)}.`); f.at=to; }
  else destroyFleet(f);
}
function respawnFleets(){
  const g=S.game;
  for(const f of fleets()) if(f.down && g.turn>=f.down){
    const owned = g.planets.filter(p=>g.owner[p]===f.side), home = owned[Math.floor(Math.random()*owned.length)];
    if(home){ f.down=0; f.at=home; logMsg(`${fleetLabel(f)} is rebuilt at ${pname(home)}.`); }
  }
}
// next jump toward the nearest planet matching goal, travelling only through planets matching pass
function stepToward(start, goal, pass){
  const g=S.game, prev={[start]:null}, q=[start];
  while(q.length){ const a=q.shift();
    for(const b of neighbors(a,g.lanes)){ if(b in prev) continue; prev[b]=a;
      if(goal(b)){ let s=b; while(prev[s]!==start) s=prev[s]; return pass(s)?s:null; }
      if(pass(b)) q.push(b); } }
  return null;
}

/* ---------- battles ---------- */
function pickMap(pid, space, g){
  let c = candidates(pid, space, g.cfg, g.era);
  if(!c.length) return null;
  const min = Math.min(...c.map(m=>g.uses[m.key]||0));
  c = c.filter(m=>(g.uses[m.key]||0)===min);
  const m = c[Math.floor(Math.random()*c.length)];
  const modes = allowedModes(m, g.era, g.cfg);
  let total = modes.reduce((s,x)=>s+(MODES[x]?MODES[x][1]:1),0), r=Math.random()*total, mode=modes[0];
  for(const x of modes){ r-= (MODES[x]?MODES[x][1]:1); if(r<=0){ mode=x; break; } }
  return {mapKey:m.key, mode};
}
function makeBattle(kind, pid, attacker, space, extra){
  const g=S.game, pick=pickMap(extra&&extra.deep?"deep":pid, space, g);
  return pick ? {kind, planet:pid, attacker, stage: space?"space":"ground", ...(extra||{}), ...pick} : null;
}
function launch(kind, pid, attacker, fleetId){
  const g=S.game, hasGround=candidates(pid,false,g.cfg,g.era).length>0;
  const native=candidates(pid,true,g.cfg,g.era).length>0;
  const defenders = fleetsOn() ? fleetsAt(pid,1-attacker) : [];
  const q=[];
  if(defenders.length){
    const deepOk = !native && candidates("deep",true,g.cfg,g.era).length>0;
    if(native || deepOk) q.push(makeBattle(kind,pid,attacker,true,{fleetClash:true, deep:!native}));
    else defenders.forEach(f=>retreatFleet(f));      // no space map to fight on: the defending fleet pulls back
  } else if(native && (g.cfg.orbital || !hasGround)) q.push(makeBattle(kind,pid,attacker,true,{}));
  if(hasGround) q.push(makeBattle(kind,pid,attacker,false,{}));
  g.queue=q.filter(Boolean).map(b=>({...b, fleet:fleetId||null})); g.phase="battle"; g.stageCount=g.queue.length;
  if(!g.queue.length){ logMsg(`No battle could be set up at ${pname(pid)}.`); g.phase="select"; }
}
function snapshot(){ S.undo.push(JSON.stringify(S.game)); if(S.undo.length>20) S.undo.shift(); }
function logMsg(t){ S.game.log.unshift({turn:S.game.turn, t}); }
const sideName = (i)=> i===-1 ? "Neutral" : ERAS[S.game.era].sides[i===0 ? S.game.side : 1-S.game.side];

function attack(pid, fleetId){
  snapshot(); const f=fleetById(fleetId); S.selected=null;
  logMsg(f ? `Your ${f.name} jumps from ${pname(f.at)} to attack ${pname(pid)}.` : `You launch an attack on ${pname(pid)}.`);
  launch("attack", pid, 0, fleetId); save(); render();
}
function moveFleet(pid, fleetId){
  snapshot(); const f=fleetById(fleetId); logMsg(`Your ${f.name} moves from ${pname(f.at)} to ${pname(pid)}.`);
  f.at=pid; S.selected=null; enemyPhase(); save(); render();
}
function holdPosition(){ snapshot(); S.selected=null; S.fleetSel=null; logMsg("You hold position this turn."); enemyPhase(); save(); render(); }

function resolve(won){
  snapshot();
  const g=S.game, b=g.queue.shift(), m=mapByKey[b.mapKey];
  g.uses[b.mapKey]=(g.uses[b.mapKey]||0)+1;
  g.history.push({turn:g.turn, kind:b.kind, stage:b.stage, planet:b.planet, map:m.name, mode:b.mode, won, clash:!!b.fleetClash});
  const attackerWon = b.attacker===0 ? won : !won;
  const where = pname(b.planet), what = b.fleetClash ? "fleet battle at" : b.stage==="space" ? "space battle over" : "ground battle on";
  logMsg(`${won?"Victory":"Defeat"} in the ${what} ${where} (${m.name}, ${modeName(b.mode)}).`);
  if(b.fleetClash){
    if(attackerWon) fleetsAt(b.planet,1-b.attacker).forEach(destroyFleet);
    else { const af=fleetById(b.fleet); if(af && !af.down) destroyFleet(af); }
  }
  if(!attackerWon){ g.queue=[]; logMsg(b.attacker===0 ? `Attack on ${where} repelled.` : `${where} holds.`); }
  if(!g.queue.length){
    if(attackerWon){ const prev=g.owner[b.planet]; g.owner[b.planet]=b.attacker;
      logMsg(b.attacker===0 ? `${where} captured${prev===-1?" from local forces":""}.` : `${where} has fallen to the ${sideName(1)}.`);
      fleetsAt(b.planet,1-b.attacker).forEach(retreatFleet);
      const af=fleetById(b.fleet); if(af && !af.down) af.at=b.planet;
    }
    if(!checkEnd()){ if(b.kind==="attack") enemyPhase(); else endRound(); }
  }
  save(); render();
}
function reroll(){
  const g=S.game, b=g.queue[0];
  for(let i=0;i<8;i++){ const t=pickMap(b.deep?"deep":b.planet, b.stage==="space", g);
    if(t && (t.mapKey!==b.mapKey || t.mode!==b.mode)){ b.mapKey=t.mapKey; b.mode=t.mode; break; } }
  save(); render();
}
function enemyPhase(){
  const g=S.game, aggr=AGGR[g.cfg.aggr][1];
  if(fleetsOn()){
    const opts=[];
    for(const f of alive(1)) for(const n of neighbors(f.at,g.lanes)) if(g.owner[n]===0)
      opts.push({f, n, w:1 + (n===g.caps[0]?1:0) + (fleetsAt(n,0).length?0:1)});
    if(opts.length && Math.random()<aggr){
      let r=Math.random()*opts.reduce((s,o)=>s+o.w,0), pick=opts[0];
      for(const o of opts){ r-=o.w; if(r<=0){ pick=o; break; } }
      logMsg(`Enemy ${pick.f.name} attacks ${pname(pick.n)} from ${pname(pick.f.at)}. Defend it.`);
      launch("defend", pick.n, 1, pick.f.id);
      if(g.phase==="battle") return;
    } else {
      const movers=alive(1).filter(f=>!neighbors(f.at,g.lanes).some(n=>g.owner[n]===0));
      let moved=false;
      if(movers.length){ const f=movers[Math.floor(Math.random()*movers.length)];
        const s=stepToward(f.at, p=>g.owner[p]===0, p=>g.owner[p]===1);
        if(s){ logMsg(`Enemy ${f.name} advances to ${pname(s)}.`); f.at=s; moved=true; } }
      if(!moved) logMsg(`The ${sideName(1)} regroup. No counterattack this turn.`);
    }
    endRound(); return;
  }
  const targets = g.planets.filter(p=>g.owner[p]===0 && neighbors(p,g.lanes).some(n=>g.owner[n]===1));
  if(targets.length && Math.random() < aggr){
    const w = targets.map(p=>neighbors(p,g.lanes).filter(n=>g.owner[n]===1).length + (p===g.caps[0]?1:0));
    let r=Math.random()*w.reduce((a,b)=>a+b,0), t=targets[0];
    for(let i=0;i<targets.length;i++){ r-=w[i]; if(r<=0){ t=targets[i]; break; } }
    logMsg(`The ${sideName(1)} attack ${pname(t)}. Defend it.`);
    launch("defend", t, 1, null);
    if(g.phase==="battle") return;
  } else logMsg(`The ${sideName(1)} regroup. No counterattack this turn.`);
  endRound();
}
function endRound(){
  const g=S.game;
  if(g.cfg.aiExpand){
    const opts = g.planets.filter(p=>g.owner[p]===-1 && neighbors(p,g.lanes).some(n=>g.owner[n]===1));
    if(opts.length && Math.random()<.35){ const p=opts[Math.floor(Math.random()*opts.length)]; g.owner[p]=1; logMsg(`The ${sideName(1)} occupy ${pname(p)} unopposed.`); }
  }
  g.turn++; g.phase="select"; g.queue=[];
  respawnFleets();
  if(fleetsOn()){ const mine=alive(0); if(!fleetById(S.fleetSel) || fleetById(S.fleetSel).down) S.fleetSel = mine.length ? mine[0].id : null; }
  if(g.cfg.turnLimit>0 && g.turn>g.cfg.turnLimit){
    const a=count(0), b=count(1);
    finish(a>b ? "won" : a<b ? "lost" : "draw", `Turn limit reached: ${a} planets to ${b}.`); return;
  }
  checkEnd();
}
const count = (o)=> S.game.planets.filter(p=>S.game.owner[p]===o).length;
function checkEnd(){
  const g=S.game;
  if(count(1)===0) return finish("won","The enemy holds no planets.");
  if(count(0)===0) return finish("lost","You hold no planets.");
  if(g.cfg.victory==="capital"){
    if(g.owner[g.caps[1]]===0) return finish("won",`You captured the enemy capital, ${pname(g.caps[1])}.`);
    if(g.owner[g.caps[0]]===1) return finish("lost",`Your capital, ${pname(g.caps[0])}, has fallen.`);
  }
  return false;
}
function finish(result, why){ const g=S.game; g.phase="over"; g.result=result; g.why=why; g.queue=[]; logMsg(why); return true; }
function undo(){ if(!S.undo.length) return; S.game=JSON.parse(S.undo.pop()); S.selected=null; S.fleetSel=null; save(); render(); }

function startCampaign(){
  const cfg=JSON.parse(JSON.stringify(S.setup)), pv=preview();
  if(pv.ids.length<3) return;
  S.game={cfg, era:cfg.era, side:cfg.side, planets:pv.ids.slice(), lanes:pv.lanes, caps:pv.caps.slice(),
    owner:{...pv.owner}, turn:1, phase:"select", queue:[], history:[], uses:{}, log:[], result:null, fleets:[]};
  initFleets(S.game);
  S.undo=[]; S.selected=null; S.fleetSel=null; S.confirmReplace=false; S.chip=null; lastFocus=null;
  logMsg(`Campaign begins: ${ERAS[cfg.era].name}. You command the ${sideName(0)} from ${pname(S.game.caps[0])}.`);
  if(fleetsOn()) S.fleetSel=alive(0)[0]?.id||null;
  previewCache=null; S.tab="command"; save(); render();
}

  <div class="note" style="font-family:var(--mono)"><span style="color:var(--you)">${nY} yours</span> · <span style="color:var(--foe)">${nF} enemy</span> · ${nN} neutral · ${pv.ids.length} total</div>
  <div class="field"><div class="flabel">Fleets per side</div>${seg("fleets",[[0,"None"],[1,"1 fleet"],[2,"2 fleets"]])}
    <div class="note">${s.fleets?`Attacks are made by moving a fleet one jump. Enemy fleets in orbit must be beaten in a space battle first, and destroyed fleets are rebuilt after ${RESPAWN} turns on a random planet their side holds.`:"Without fleets you can attack any planet that borders your territory."}</div></div>
  <div class="field"><label for="aggr">Enemy aggression</label><select id="aggr" data-act="sel" data-k="aggr">${Object.entries(AGGR).map(([k,v])=>`<option value="${k}" ${s.aggr===k?"selected":""}>${v[0]}</option>`).join("")}</select></div>
  <div class="field"><label for="victory">Victory condition</label><select id="victory" data-act="sel" data-k="victory"><option value="capital" ${s.victory==="capital"?"selected":""}>Capture the enemy capital</option><option value="all" ${s.victory==="all"?"selected":""}>Conquer every enemy planet</option></select></div>
  <div class="field"><label for="turnLimit">Turn limit (0 = none)</label><input id="turnLimit" type="number" min="0" max="99" value="${s.turnLimit}" data-act="num" data-k="turnLimit"></div>
  <div class="checks">
    <label><input id="orbital" type="checkbox" data-act="chk" data-k="orbital" ${s.orbital?"checked":""}> Space battle before ground</label>
    <label><input id="aiExpand" type="checkbox" data-act="chk" data-k="aiExpand" ${s.aiExpand?"checked":""}> Enemy grabs neutral planets</label>
    <label><input id="stock" type="checkbox" data-act="chk" data-k="stock" ${s.stock?"checked":""}> Stock maps</label>
    <label><input id="mods" type="checkbox" data-act="chk" data-k="mods" ${s.mods?"checked":""}> Mod maps</label>
  </div>
  <div class="field"><div class="flabel">Game modes</div><div class="checks">${eraModes.map(x=>`<label><input id="mode-${x}" type="checkbox" data-act="mode" data-v="${x}" ${s.modes.includes(x)?"checked":""}> ${MODES[x][0]}</label>`).join("")}</div></div>
  <details><summary>Map pool (${MAPS.filter(m=>m.eras[s.era]&&!s.excluded.includes(m.key)).length} of ${MAPS.filter(m=>m.eras[s.era]).length} maps on)</summary>
    <div class="pool">${Object.keys(byPlanet).sort((a,b)=>pname(a).localeCompare(pname(b))).map(p=>`<div><h4>${esc(pname(p))}</h4>${byPlanet[p].map(m=>`<label><input id="pool-${m.key}" type="checkbox" data-act="pool" data-v="${m.key}" ${s.excluded.includes(m.key)?"":"checked"}> <span>${esc(m.name)} <small>${m.src==="stock"?"stock":esc(m.folder)}${m.space?" · space":""}</small></span></label>`).join("")}</div>`).join("")}</div>
  </details>
  <div class="note">${pv.ids.length} planets in play · capitals ${esc(pv.caps[0]?pname(pv.caps[0]):"—")} (you) and ${esc(pv.caps[1]?pname(pv.caps[1]):"—")}.</div>
  <div class="row"><button class="btn primary" data-act="start" ${pv.ids.length<3?"disabled":""}>${S.confirmReplace?"Replace current campaign":"Start campaign"}</button><button class="btn" data-act="reshuffle">Reshuffle preview</button></div>
  ${pv.ids.length<3?`<div class="note" style="color:var(--loss)">Too few planets have maps with these settings. Turn on more modes or map sources.</div>`:""}`;
}
function renderLog(){
  if(!S.game||!S.game.log.length) return `<div class="empty">The campaign log fills in as you play.</div>`;
  return `<div class="log">${S.game.log.map(e=>`<div><span class="t">T${e.turn}</span>${esc(e.t)}</div>`).join("")}</div>`;
}
function renderSave(){
  const data=JSON.stringify({setup:S.setup, game:S.game});
  return `<div class="note">Progress saves automatically in this browser. To move a campaign to another device or keep a backup, copy the save code and paste it there.</div>
  <div class="field"><label for="exportBox">Save code</label><textarea id="exportBox" readonly>${esc(data)}</textarea><div><button class="btn small" data-act="copy">Copy save code</button> <span class="note" id="copyMsg"></span></div></div>
  <div class="field"><label for="importBox">Load a save code</label><textarea id="importBox" placeholder="Paste a save code here"></textarea><div><button class="btn small" data-act="import">Load</button> <span class="note" id="importMsg"></span></div></div>
  <div><button class="btn small" data-act="reset">${S.confirmReset?"Click again to erase everything":"Erase campaign and settings"}</button></div>`;
}
function renderBar(){
  const bar=$("actionbar"), g=S.game; let h="";
  if(S.tab==="setup"){
    const pv=preview();
    h=`<div class="row"><button class="btn primary" style="flex:1" data-act="start" ${pv.ids.length<3?"disabled":""}>${S.confirmReplace?"Replace current campaign":"Start campaign"}</button></div>`;
  } else if(g && g.phase==="battle" && S.tab==="command"){
    const b=g.queue[0], m=mapByKey[b.mapKey], idx=g.stageCount-g.queue.length+1;
    h=`<div><div class="bar-sub">Turn ${g.turn} · ${b.kind==="attack"?"Your attack":"Defending"}${g.stageCount>1?` · battle ${idx} of ${g.stageCount}`:""}</div>
      <div class="bar-title">${esc(m.name)}</div>
      <div class="bar-sub">${esc(modeName(b.mode))} · ${esc(ERAS[g.era].name)} · play as ${esc(sideName(0))}</div></div>
      <div class="row"><button class="btn win" data-act="won">I won</button><button class="btn loss" data-act="lost">I lost</button></div>`;
  } else if(g && g.phase==="select" && S.tab==="command"){
    const t=targetsNow(), sel=S.selected, valid=sel&&t.includes(sel);
    if(fleetsOn()){
      const f=fleetById(S.fleetSel);
      if(!f||f.down) h=`<div class="bar-sub">Pick a fleet to move</div><div class="row">${alive(0).map(x=>`<button class="btn small" style="flex:1" data-act="fleet" data-v="${x.id}">${esc(x.name)} · ${esc(pname(x.at))}</button>`).join("")||`<span class="bar-sub">No fleets available. Hold position to end the turn.</span>`}<button class="btn small" data-act="hold">Hold</button></div>`;
      else if(valid) h=`<div class="row"><button class="btn primary" style="flex:1" data-act="${g.owner[sel]===0?"move":"attack"}" data-v="${sel}">${g.owner[sel]===0?`Move ${esc(f.name)} to ${esc(pname(sel))}`:`Attack ${esc(pname(sel))}`}</button><button class="btn small" data-act="clear">Cancel</button></div>`;
      else h=`<div class="bar-sub">${esc(f.name)} at ${esc(pname(f.at))}. Tap a ringed planet to move or attack.</div><div class="row"><button class="btn small" data-act="fleet" data-v="${f.id}">Change fleet</button><button class="btn small" data-act="hold">Hold position</button></div>`;
    } else {
      h = valid ? `<div class="row"><button class="btn primary" style="flex:1" data-act="attack" data-v="${sel}">Attack ${esc(pname(sel))}</button><button class="btn small" data-act="clear">Cancel</button></div>`
        : `<div class="bar-sub">Tap a ringed planet to attack it.</div><div class="row"><button class="btn small" data-act="hold">Hold position</button></div>`;
    }
  }
  bar.innerHTML=h; bar.hidden=!h; document.body.classList.toggle("has-bar", !!h);
}
function applyZoom(){
  const svg=$("galaxy"); svg.style.width = zoom ? zoom+"px" : "100%";
  document.querySelector(".chart").classList.toggle("zoomed", !!zoom);
  $("zoomFit").setAttribute("aria-pressed", String(!zoom));
}
function centerOn(pid, smooth){
  const sc=$("mapScroll"), svg=$("galaxy"); if(!zoom || !PLANETS[pid]) return;
  const k=svg.clientWidth/1000;
  sc.scrollTo({left:PLANETS[pid].x*k - sc.clientWidth/2, top:PLANETS[pid].y*k - sc.clientHeight/2, behavior:smooth?"smooth":"auto"});
}
function focusPlanet(){
  const g=S.game; if(!g || S.tab==="setup") return null;
  if(g.phase==="battle" && g.queue[0]) return g.queue[0].planet;
  const f=fleetById(S.fleetSel); if(f && !f.down) return f.at;
  return null;
}
function render(){
  if(!S.game && S.tab==="command") S.tab="setup";
  applyZoom(); renderStats(); renderMap(); renderChips(); renderBar();
  const fp=focusPlanet(); if(fp && fp!==lastFocus) centerOn(fp, true); lastFocus=fp;
  document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-selected", String(b.dataset.tab===S.tab)));
  $("pane").innerHTML = S.tab==="setup"?renderSetup(): S.tab==="log"?renderLog(): S.tab==="save"?renderSave(): renderCommand();
}

/* ---------- events ---------- */
function clickPlanet(p, fleetId){
  if(S.tab==="setup" || !S.game){
    if(S.setup.start==="custom"){ const pv=preview(); if(pv.caps.includes(p)) return;
      const cur=pv.owner[p]; S.setup.custom[p]= cur===0?1: cur===1?-1:0; save(); render(); }
    return;
  }
  const g=S.game; S.tab="command";
  if(fleetsOn() && g.phase==="select"){
    const f=fleetById(fleetId);
    if(f && f.side===0){ S.fleetSel = S.fleetSel===f.id ? null : f.id; S.selected=null; render(); return; }
    const sel=fleetById(S.fleetSel);
    if(!(sel && !sel.down && neighbors(sel.at,g.lanes).includes(p))){
      const mineHere=fleetsAt(p,0); if(mineHere.length && !S.selected){ S.fleetSel=mineHere[0].id; render(); return; }
    }
  }
  S.selected = S.selected===p ? null : p; render();
}
$("galaxy").addEventListener("click",e=>{ const g=e.target.closest(".planet"); if(g) clickPlanet(g.dataset.p, g.dataset.f); });
$("galaxy").addEventListener("keydown",e=>{ if((e.key==="Enter"||e.key===" ")){ const g=e.target.closest(".planet"); if(g){ e.preventDefault(); clickPlanet(g.dataset.p, g.dataset.f);} } });
$("tabs").addEventListener("click",e=>{ const b=e.target.closest("button"); if(!b) return; S.tab=b.dataset.tab; S.confirmReplace=false; S.confirmReset=false; render(); });
function onAct(e){
  const b=e.target.closest("[data-act]"); if(!b || b.tagName==="INPUT" || b.tagName==="SELECT") return;
  const a=b.dataset.act, v=b.dataset.v, s=S.setup;
  if(a==="tab"){ S.tab=v; render(); }
  else if(a==="set"){ const k=b.dataset.k; s[k]= (k==="side"||k==="fleets") ? Number(v) : v; if(k==="era"||k==="side"||(k==="start"&&v==="custom")) s.custom={}; S.confirmReplace=false; save(); render(); }
  else if(a==="start"){ if(S.game && S.game.phase!=="over" && !S.confirmReplace){ S.confirmReplace=true; render(); return; } startCampaign(); }
  else if(a==="reshuffle"){ preview(true); s.custom={}; render(); }
  else if(a==="select"){ S.selected=v; render(); }
  else if(a==="fleet"){ S.fleetSel = S.fleetSel===v ? null : v; S.selected=null; render(); }
  else if(a==="attack") attack(v, fleetsOn()?S.fleetSel:null);
  else if(a==="move") moveFleet(v, S.fleetSel);
  else if(a==="hold") holdPosition();
  else if(a==="won") resolve(true);
  else if(a==="lost") resolve(false);
  else if(a==="reroll") reroll();
  else if(a==="undo") undo();
  else if(a==="copy"){ const t=$("exportBox"); const ok=()=>{$("copyMsg").textContent="Copied.";};
    try{ navigator.clipboard.writeText(t.value).then(ok,()=>{t.select(); $("copyMsg").textContent="Selected. Press Ctrl+C to copy.";}); }catch(err){ t.select(); $("copyMsg").textContent="Selected. Press Ctrl+C to copy."; } }
  else if(a==="import"){ try{ const d=JSON.parse($("importBox").value); if(!d.setup) throw 0; S.setup=Object.assign(defaultSetup(),d.setup); S.game=d.game||null; S.undo=[]; previewCache=null; save(); S.tab=S.game?"command":"setup"; render(); }catch(err){ $("importMsg").textContent="That isn't a valid save code. Copy the whole code and try again."; } }
  else if(a==="reset"){ if(!S.confirmReset){ S.confirmReset=true; render(); return; } S={setup:defaultSetup(),game:null,undo:[],tab:"setup",selected:null,fleetSel:null,confirmReplace:false,confirmReset:false,chip:null}; previewCache=null; save(); render(); }
  else if(a==="clear"){ S.selected=null; render(); }
}
$("pane").addEventListener("click", onAct);
$("actionbar").addEventListener("click", onAct);
$("chips").addEventListener("click",e=>{ const c=e.target.closest(".chip"); if(!c) return; const i=Number(c.dataset.i); S.chip = S.chip===i?null:i; renderChips(); });
$("zoomIn").addEventListener("click",()=>{ const i=ZOOMS.indexOf(zoom); zoom=ZOOMS[Math.min(ZOOMS.length-1,i+1)]; render(); const fp=focusPlanet()||S.selected; if(fp) centerOn(fp,false); });
$("zoomOut").addEventListener("click",()=>{ const i=ZOOMS.indexOf(zoom); zoom=ZOOMS[Math.max(0,i-1)]; render(); const fp=focusPlanet()||S.selected; if(fp) centerOn(fp,false); });
$("zoomFit").addEventListener("click",()=>{ zoom=0; render(); });
$("pane").addEventListener("change",e=>{
  const t=e.target, a=t.dataset.act, k=t.dataset.k, s=S.setup; if(!a) return;
  if(a==="sel") s[k]=t.value;
  else if(a==="num"){ s[k]=Math.max(0, Number(t.value)||0);
    if(k==="youN"||k==="foeN"){ const total=preview().ids.length, other=k==="youN"?"foeN":"youN"; if(s.youN+s.foeN>total) s[other]=Math.max(1,total-s[k]); } }
  else if(a==="chk") s[k]=t.checked;
  else if(a==="mode"){ const v=t.dataset.v; s.modes = t.checked ? [...new Set([...s.modes,v])] : s.modes.filter(x=>x!==v); }
  else if(a==="pool"){ const v=t.dataset.v; s.excluded = t.checked ? s.excluded.filter(x=>x!==v) : [...s.excluded,v]; }
  S.confirmReplace=false; save(); render();
});
$("pane").addEventListener("input",e=>{ const t=e.target;
  if(t.id==="youN"||t.id==="foeN"){ const sd=ERAS[S.setup.era].sides, mine=S.setup.side===0?sd[0]:sd[1], theirs=S.setup.side===0?sd[1]:sd[0];
    t.previousElementSibling.textContent=`${t.id==="youN"?mine:theirs} start with ${t.value} planet${t.value==="1"?"":"s"}`; } });

load();
const hot=window.claude?.hot;
if(hot?.snapshot) hot.snapshot(()=>({setup:S.setup, game:S.game, undo:S.undo, tab:S.tab}));
const boot=(d)=>{ if(d && d.setup){ S.setup=Object.assign(defaultSetup(),d.setup); S.game=d.game||null; S.undo=d.undo||[]; S.tab=d.tab||S.tab; } render(); };
hot?.ready ? hot.ready(boot) : boot(hot?.data ?? {});
</script></body></html>
